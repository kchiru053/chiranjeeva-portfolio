spring.application.name=chiranjeeva-portfolio
server.port=${PORT:8080}
# Behind Render/Railway/nginx: use X-Forwarded-* headers (correct client IP for the contact rate limit)
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml

# Contact-form messages are stored in a local H2 file database (./data/portfolio.mv.db)
spring.datasource.url=jdbc:h2:file:./data/portfolio
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# --- Optional settings (all via environment variables) ---
# Serve the content from a file on disk instead of the bundled one (re-read on every request):
portfolio.data-file=${PORTFOLIO_DATA_FILE:}
# Enables GET/DELETE /api/admin/messages with header X-Admin-Key (disabled while empty):
portfolio.admin.key=${ADMIN_KEY:}
# Email a notification for each contact message. Also needs SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD (+ SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true,
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true for Gmail on port 587).
portfolio.contact.notify-to=${CONTACT_NOTIFY_TO:}
portfolio.contact.from=${CONTACT_FROM:}
